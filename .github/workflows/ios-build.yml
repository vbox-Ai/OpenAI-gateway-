name: iOS IPA 构建

# 从网关静态库到可安装 .ipa 的完整流水线（跑在 macOS runner 上）。
#
# 链路：cargo build .a → flutter create 平台壳 → 链接 .a（Ruby 直改
#       Runner.xcodeproj 的 OTHER_LDFLAGS + force_load）→ flutter build ios
#       --no-codesign → 打包 Payload → .ipa
#
# 关键：dart:ffi 运行时才解析 Rust 符号，链接期没有代码引用，链接器会 dead-strip
#       整个 .a，必须 -force_load 强制完整链入。
#
# 签名：默认不签名（--no-codesign）。越狱机用 ldid -S 假签名即可安装。

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（含 iOS 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 构建网关静态库（iOS arm64）
        run: |
          cd desktop-tauri/src-tauri/server
          cargo build --release --target aarch64-apple-ios --lib

      - name: 生成 Flutter 平台壳
        run: |
          cd mobile-app
          flutter create . --org com.vbox --project-name agent2api_mobile --platforms ios --no-pub

      - name: 恢复源码 + 拷贝静态库 + 生成 Podfile
        run: |
          git checkout HEAD -- mobile-app/pubspec.yaml mobile-app/lib mobile-app/rust
          mkdir -p mobile-app/rust
          cp target/aarch64-apple-ios/release/libagent2api_server.a mobile-app/rust/
          cat > mobile-app/ios/Podfile <<'RUBYEOF'
          # 注意：不能用过低的 platform —— 当前 Flutter 3.47 的 Flutter pod
          # 要求更高的最低部署目标，13.0 会触发 "required a higher minimum
          # deployment target" 错误。
          platform :ios, '15.0'

          ENV['COCOAPODS_DISABLE_STATS'] = 'true'

          project 'Runner', {
            'Debug' => :debug,
            'Profile' => :release,
            'Release' => :release,
          }

          def flutter_root
            generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
            unless File.exist?(generated_xcode_build_settings_path)
              raise "#{generated_xcode_build_settings_path} must exist. If you're running pod install manually, make sure flutter pub get is executed first"
            end
            File.foreach(generated_xcode_build_settings_path) do |line|
              matches = line.match(/FLUTTER_ROOT\=(.*)/)
              return matches[1].strip if matches
            end
            raise "FLUTTER_ROOT not found in #{generated_xcode_build_settings_path}"
          end

          require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)

          flutter_ios_podfile_setup

          target 'Runner' do
            use_frameworks!
            use_modular_headers!

            flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))

            target 'RunnerTests' do
              inherit! :search_paths
            end
          end

          post_install do |installer|
            installer.pods_project.targets.each do |target|
              flutter_additional_ios_build_settings(target)
            end
          end
          RUBYEOF

      - name: 准备依赖（pub get + pod install）
        run: |
          cd mobile-app
          flutter pub get
          cd ios
          pod install
          cd ..

      - name: 强制链接 Rust 静态库（直改 Runner.xcodeproj）
        run: |
          ruby -e "
            require 'xcodeproj'
            project = Xcodeproj::Project.open('mobile-app/ios/Runner.xcodeproj')
            rust_lib = File.expand_path('mobile-app/rust/libagent2api_server.a')
            project.targets.each do |t|
              next unless t.name == 'Runner'
              t.build_configurations.each do |c|
                base = c.build_settings['OTHER_LDFLAGS']
                base = '\$(inherited)' if base.nil? || base.empty?
                c.build_settings['OTHER_LDFLAGS'] = base + ' -force_load ' + rust_lib
              end
            end
            project.save
            puts 'force_load injected into Runner OTHER_LDFLAGS'
          "

      - name: 构建 iOS App（无签名）
        run: |
          cd mobile-app
          flutter build ios --no-codesign --release

      - name: 打包 IPA
        run: |
          cd mobile-app/build/ios/iphoneos
          du -sh Runner.app
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -qry agent2api-mobile.ipa Payload
          ls -lh agent2api-mobile.ipa

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: agent2api-mobile-ios
          path: mobile-app/build/ios/iphoneos/agent2api-mobile.ipa
          if-no-files-found: error
