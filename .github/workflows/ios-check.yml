name: iOS 编译检查（网关服务器）

# 验证网关 headless 服务器（agent2api-server）能否为 aarch64-apple-ios 编译并产出静态库。
# 这是「复用网关整机」路线的可行性验证 + 产物生成：
#   · cargo check  —— 快速类型检查（验证代码可编译）
#   · cargo build --lib  —— 产出 libagent2api_server.a（供 Flutter 链接）
# 网关用 axum + rustls + bundled SQLite，纯 Rust、无桌面依赖。

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ios-check-server:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（含 iOS 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri/server -> ../../target

      - name: 编译检查（iOS 目标）
        run: |
          cd desktop-tauri/src-tauri/server
          cargo check --target aarch64-apple-ios -p agent2api-server

      - name: 真实构建静态库（iOS arm64 release）
        run: |
          cd desktop-tauri/src-tauri/server
          cargo build --release --target aarch64-apple-ios --lib

      - name: 上传静态库产物
        uses: actions/upload-artifact@v4
        with:
          name: libagent2api_server-ios-arm64
          path: target/aarch64-apple-ios/release/libagent2api_server.a
          if-no-files-found: error
