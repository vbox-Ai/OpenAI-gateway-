name: iOS 编译检查（网关服务器）

# 验证网关 headless 服务器（agent2api-server）能否为 aarch64-apple-ios 编译。
# 这是「复用网关整机」路线的第一步可行性验证：agent2api-server 用
# axum + rustls + bundled SQLite，理论上是纯 Rust、无桌面依赖，应该能过。
# 若通过，下一步把它改成 staticlib + 库入口，供 Flutter 进程内启动。

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ios-check-server:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（含 iOS 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri/server -> ../../target

      - name: 编译检查 agent2api-server for iOS
        run: |
          cd desktop-tauri/src-tauri/server
          cargo check --target aarch64-apple-ios -p agent2api-server
